actions:
  - name: initiateTransaction
    definition:
      kind: synchronous
      handler: '{{WEB_HOOK_URL}}/payment/initiate'
      request_transform:
        body:
          action: transform
          template: '{{$body.input.arg}}'
        template_engine: Kriti
        version: 2
      response_transform:
        body:
          action: transform
          template: |
            {{$body}}
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
  - name: login
    definition:
      kind: synchronous
      handler: '{{WEB_HOOK_URL}}/auth/login'
      timeout: 3
      request_transform:
        body:
          action: transform
          template: |-
            {
              "email": {{$body.input.email}},
              "password": {{$body.input.password}}
            }
        template_engine: Kriti
        version: 2
      response_transform:
        body:
          action: transform
          template: |
            {{$body}}
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
  - name: payWithWallet
    definition:
      kind: synchronous
      handler: '{{WEB_HOOK_URL}}/v1/wallet/pay'
      timeout: 15
      forward_client_headers: false
      headers:
        - name: x-action-secret
          value_from_env: ACTION_SECRET
      request_transform:
        body:
          action: transform
          template: |-
            {
              "machine_id": {{$body.input.arg.machine_id}},
              "username": {{$body.input.arg.username}},
              "password": {{$body.input.arg.password}},
              "items": {{$body.input.arg.items}}
            }
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
  - name: signup
    definition:
      kind: synchronous
      handler: '{{WEB_HOOK_URL}}/auth/register'
      request_transform:
        body:
          action: transform
          template: |-
            {
              "first_name":{{$body.input.arg1.first_name}},
              "last_name":{{$body.input.arg1.last_name}},
              "email": {{$body.input.arg1.email}},
              "password": {{$body.input.arg1.password}}
            }
        method: POST
        query_params: {}
        template_engine: Kriti
        version: 2
      response_transform:
        body:
          action: transform
          template: '{{$body}}'
        template_engine: Kriti
        version: 2
    permissions:
      - role: anonymous
custom_types:
  enums: []
  input_objects:
    - name: UserInput
    - name: InitiateTransactionInput
    - name: ItemRequestInput
    - name: PayWithWalletInput
  objects:
    - name: UserOutput
    - name: UserDto
    - name: SampleOutput
    - name: InitiateTransactionOutput
    - name: PayWithWalletOutput
  scalars: []
